[package]
name = "llm-provider-router"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible provider router proxy with Rust backend and React dashboard"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "macros"] }
bytes = "1.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
http = "1.3"
httpdate = "1.0"
libc = "0.2"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
# 可移植构建：静态链接 OpenSSL（vendored）。
# 2026-11-12 部署事故：工作站 rolling 升级到 OpenSSL 4 后产出的二进制依赖
# libssl.so.4，部署机（Ubuntu 26.04 LXC）只有 libssl.so.3 → 槽启动即
# `error while loading shared libraries`，部署直接失败。vendored 后二进制
# 不依赖带机 OpenSSL，换机器/换发行版升级都不再受版本摇摆影响。
openssl = { version = "0.10", features = ["vendored"] }
scraper = "0.23"
tokio-tungstenite = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "time", "process", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }

[dev-dependencies]
flate2 = "1"
tempfile = "3.14"
